name: "Release: Publish"
run-name: "Release: ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: release

jobs:
  CheckForRelease:
    runs-on: ubuntu-latest
    name: CheckForRelease
    outputs:
      isReleased: ${{steps.checkrelease.outputs.isReleased}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          ref: ${{inputs.tag}}
          fetch-depth: 0
      - id: checkrelease
        shell: bash
        run: |
          if gh release view "${{inputs.tag}}" &> /dev/null; then
            echo "isReleased=true" >> $GITHUB_OUTPUT
          else
            echo "isReleased=false" >> $GITHUB_OUTPUT
          fi
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  UnitIntegTests:
    needs: CheckForRelease
    name: Unit and Integration Tests
    uses: ./.github/workflows/code_quality.yml
    with:
      ref: ${{inputs.tag}}

  LinuxE2ETests:
    needs: [UnitIntegTests, CheckForRelease]
    name: Linux E2E Test
    permissions:
      id-token: write
      contents: read
    uses: moorec-aws/.github/.github/workflows/reusable_e2e_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: mainline
      environment: mainline
      os: linux
      tag: ${{inputs.tag}}
    concurrency:
      group: linuxe2e

  WindowsE2ETests:
    needs: [UnitIntegTests, CheckForRelease]
    name: Windows E2E Test
    permissions:
      id-token: write
      contents: read
    uses: moorec-aws/.github/.github/workflows/reusable_e2e_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: mainline
      environment: mainline
      os: windows
      tag: ${{inputs.tag}}
    concurrency:
      group: windowse2e

  PreRelease:
    needs: [CheckForRelease, UnitIntegTests, LinuxE2ETests, WindowsE2ETests]
    if: needs.CheckForRelease.outputs.isReleased == 'false'
    uses: moorec-aws/.github/.github/workflows/reusable_prerelease.yml@mainline
    secrets: inherit
    with:
        tag: ${{inputs.tag}}

  Release:
      needs: PreRelease
      uses: moorec-aws/.github/.github/workflows/reusable_release.yml@mainline
      secrets: inherit
      with:
          tag: ${{inputs.tag}}
  
  Publish:
    needs: Release
    uses: moorec-aws/.github/.github/workflows/reusable_publish_python.yml@mainline
    secrets: inherit
    with:
        tag: ${{inputs.tag}}

  # PyPI does not support reusable workflows yet
  # # See https://github.com/pypi/warehouse/issues/11096
  PublishToPyPI:
    needs: Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{inputs.tag}}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install --upgrade hatch
      - name: Build
        run: hatch -v build
      # # See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

